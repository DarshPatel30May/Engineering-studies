<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive visual study guide for NSW HSC Engineering Studies 2026: Civil Structures, Personal and Public Transport, Aeronautical Engineering and Telecommunications Engineering." />
    <title>HSC Engineering Studies 2026 — Visual Study Guide</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('hsc-eng:prefs') || '{}');
        var dark = p.theme ? p.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
